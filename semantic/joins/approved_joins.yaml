# semantic/joins/approved_joins.yaml
# ─────────────────────────────────────────────────────────────
# APPROVED JOIN PATHS
# Pre-approved table joins linking your clinical and patient records.
# ─────────────────────────────────────────────────────────────

version: v1

approved_joins:
  - from_table: Patient
    to_table: Appointment
    join_type: INNER JOIN
    condition: "p.Id = a.PatientId"
    aliases: {Patient: "p", Appointment: "a"}
    notes: "Connects patient demographics to their appointment records."

  - from_table: Appointment
    to_table: Employee
    join_type: INNER JOIN
    condition: "a.DoctorId = e.Id"
    aliases: {Appointment: "a", Employee: "e"}
    notes: "Connects appointment visits to the doctor who saw the patient. (Patient has no DoctorId column; the doctor is recorded per appointment.)"

  - from_table: Appointment
    to_table: Complaints
    join_type: LEFT JOIN
    condition: "a.Id = c.Appointment"
    aliases: {Appointment: "a", Complaints: "c"}
    notes: "Connects appointment visits to patient complaints."

  - from_table: Appointment
    to_table: ServicePrescription
    join_type: LEFT JOIN
    condition: "a.Id = sr.Appointment"
    aliases: {ServicePrescription: "sr", Appointment: "a"}
    notes: "Connects appointment visits to service prescriptions. Use this connection to get the appointment wise service prescription details"

  - from_table: Appointment 
    to_table: MedicinePrescription
    join_type: LEFT JOIN
    condition: "a.Id = mp.Appointment"
    aliases: {MedicinePrescription: "mp", Appointment: "a"}
    notes: "Connects appointment visits to medicine prescriptions."

  