version: v1
table: Appointment
schema_name: dbo
description: Table Appointment in dbo schema.
columns:
- name: Id
  type: int
  IS_NULLABLE: 'NO'
  description: Column Id
- name: VisitDate
  type: date
  IS_NULLABLE: 'YES'
  description: this is the date of the appointment for the patient. Column VisitDate
- name: PatientId
  type: int
  IS_NULLABLE: 'YES'
  description: this is the patient id for the appointment that comes from the Patient table. Column PatientId
- name: DoctorId
  type: int
  IS_NULLABLE: 'YES'
  description: this is the doctor id for the appointment that comes from the Employee table. This column helps in identifying which doctor is assigned to the appointment. Column DoctorId
- name: VisitStatus
  type: varchar
  IS_NULLABLE: 'YES'
  description: this column shows the status of the appointment. The column values would be either 'completed', 'cancelled', or 'pending'. Column VisitStatus
- name: PatientType
  type: varchar
  IS_NULLABLE: 'YES'
  description: This defines whether the patient is a new patient or a follow up patient. The column values would be either 'New' or 'Follow-up'. Column PatientType
- name: ParentAppointment
  type: int
  IS_NULLABLE: 'YES'
  description: this is the parent appointment id for the appointment. This is for tracking related appointments like follow-up appointments. Column ParentAppointment
- name: eRxReferenceNumber
  type: varchar
  IS_NULLABLE: 'YES'
  description: Column eRxReferenceNumber
- name: TPS_Id
  type: int
  IS_NULLABLE: 'YES'
  description: Column TPS_Id
- name: BranchId
  type: int
  IS_NULLABLE: 'YES'
  description: Branch where this record belongs (BranchMaster.BranchId)  

branch_column: BranchId           # filtered to the selected branch(es) automatically  
business_notes: for a user query, never return any ID or TPS_Id column in the output. It is an internal identifier and should not be exposed to end users. Incase of returning a row, always return the Name column to identify the person. For example, for a doctor, return the Name column from the Employee table to identify the doctor. For a patient, return the Name column from the Patient table to identify the patient.

