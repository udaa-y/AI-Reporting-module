version: v1
table: MedicinePrescription
schema_name: dbo
description: Table MedicinePrescription in dbo schema.
columns:
- name: Id
  type: int
  IS_NULLABLE: 'NO'
  description: Column Id
- name: MedicineCode
  type: varchar
  IS_NULLABLE: 'YES'
  description: This is the code for the medicine that is prescribed to the patient. Column MedicineCode
- name: MedicineName
  type: varchar
  IS_NULLABLE: 'YES'
  description: Name of the medicine that is prescribed to the patient. Column MedicineName
- name: MedicineType
  type: varchar
  IS_NULLABLE: 'YES'
  description: Type of the medicine that is prescribed to the patient. Column values here would be mostly like 'Tablet', 'Bottle' etc. Column MedicineType
- name: Quantity
  type: int
  IS_NULLABLE: 'YES'
  description: this is the quantity of the medicine prescribed to the patient. Column Quantity
- name: UseType
  type: varchar
  IS_NULLABLE: 'YES'
  description: This is the type of use for the medicine. Column values here would be mostly like 'Before Food', 'After Food' etc. Column UseType
- name: Facility
  type: varchar
  IS_NULLABLE: 'YES'
  description: This is the facility where the medicine is prescribed. Facility means the healthcare administration. The column values can be 'DHA', 'MOH', 'DOH', 'SHA' etc. Column Facility
- name: Status
  type: varchar
  IS_NULLABLE: 'YES'
  description: This is the status of the medicine prescription. Column values here would be mostly like 'Active', 'Inactive' etc. Column Status
- name: Manufacturer
  type: varchar
  IS_NULLABLE: 'YES'
  description: This is the manufacturer of the medicine. Column Manufacturer
- name: Appointment
  type: int
  IS_NULLABLE: 'YES'
  description: Column Appointment
- name: TPS_Id
  type: int
  IS_NULLABLE: 'YES'
  description: Column TPS_Id
- name: BranchId
  type: int
  IS_NULLABLE: 'YES'
  description: Branch where this record belongs (BranchMaster.BranchId)  

branch_column: BranchId           # filtered to the selected branch(es) automatically
business_notes: for a user query, never return any ID or TPS_Id column in the output. It is an internal identifier and should not be exposed to end users.
