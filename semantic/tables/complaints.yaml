version: v1
table: Complaints
schema_name: dbo
description: Table Complaints in dbo schema.
columns:
- name: Id
  type: int
  IS_NULLABLE: 'NO'
  description: Column Id
- name: Complaint
  type: varchar
  IS_NULLABLE: 'YES'
  description: This is the complaint description that the patient has raised. Column Complaint
- name: Appointment
  type: int
  IS_NULLABLE: 'YES'
  description: This is the appointment id for the complaint. This links the complaint to a specific appointment. Column Appointment
- name: TPS_Id
  type: int
  IS_NULLABLE: 'YES'
  description: This is the internal identifier for the complaint. Column TPS_Id
- name: BranchId
  type: int
  IS_NULLABLE: 'YES'
  description: Branch where this record belongs (BranchMaster.BranchId)  

branch_column: BranchId           # filtered to the selected branch(es) automatically  
branch_linked: "Id IN (SELECT Appointment FROM dbo.Complaints WHERE BranchId IN ({branch_ids}))"
business_notes: for a user query, never return any ID or TPS_Id column in the output. It is an internal identifier and should not be exposed to end users.
