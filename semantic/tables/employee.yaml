version: v1
table: Employee
schema_name: dbo
description: Table Employee in dbo schema.
columns:
- name: Id
  type: int
  IS_NULLABLE: 'NO'
  description: Column Id
- name: Name
  type: varchar
  IS_NULLABLE: 'YES'
  description: Name of the employee. Column Name
- name: Department
  type: varchar
  IS_NULLABLE: 'YES'
  description: Department to which the employee belongs. If Doctor, this would be the medical department, if its other staff, it would be mentioned as 'Administration'. Column Department
- name: Type
  type: varchar
  IS_NULLABLE: 'YES'
  description: This column defines the type of employee. The values would be either 'Doctor' or 'Staff'. Column Type
- name: Gender
  type: varchar
  IS_NULLABLE: 'YES'
  description:  Gender of the employee. Column Gender
- name: TPS_Id
  type: int
  IS_NULLABLE: 'YES'
  description: Column TPS_Id
- name: BranchId
  type: int
  IS_NULLABLE: 'YES'
  description: Branch where this record belongs (BranchMaster.BranchId)

branch_column: BranchId           # filtered to the selected branch(es) automatically  

branch_linked: "Id IN (SELECT DoctorId FROM dbo.Appointment WHERE BranchId IN ({branch_ids}))"

business_notes: for a user query, never return any ID or TPS_Id column in the output. It is an internal identifier and should not be exposed to end users. Incase of returning a row, always return the Name column to identify the employee.
