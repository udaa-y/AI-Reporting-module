version: v1
table: Patient
schema_name: dbo
description: Table Patient in dbo schema.
columns:
- name: Id
  type: int
  IS_NULLABLE: 'NO'
  description: Column Id
- name: Name
  type: varchar
  IS_NULLABLE: 'YES'
  description: Column Name
- name: MRNNumber
  type: int
  IS_NULLABLE: 'YES'
  description: Column MRNNumber
- name: RegisteredOn
  type: date
  IS_NULLABLE: 'YES'
  description: Column RegisteredOn
- name: DateOfBirth
  type: date
  IS_NULLABLE: 'YES'
  description: Column DateOfBirth
- name: Gender
  type: varchar
  IS_NULLABLE: 'YES'
  description: Column Gender
- name: Nationality
  type: varchar
  IS_NULLABLE: 'YES'
  description: Column Nationality
- name: ResidencyType
  type: varchar
  IS_NULLABLE: 'YES'
  description: Column ResidencyType
- name: TPS_Id
  type: int
  IS_NULLABLE: 'YES'
  description: Column TPS_Id
- name: BranchId
  type: int
  IS_NULLABLE: 'YES'
  description: Branch where this record belongs (BranchMaster.BranchId)  

branch_column: BranchId           # filtered to the selected branch(es) automatically    

branch_linked: "Id IN (SELECT PatientId FROM dbo.Appointment WHERE BranchId IN ({branch_ids}))"

business_notes: for a user query, never return any ID or TPS_Id column in the output. It is an internal identifier and should not be exposed to end users.
