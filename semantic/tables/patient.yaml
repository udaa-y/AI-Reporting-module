version: v1
table: Patient
schema_name: dbo
description: Table Patient in dbo schema.
columns:
- name: Id
  type: int
  IS_NULLABLE: 'NO'
  description: Column Id
- name: Name
  type: varchar
  IS_NULLABLE: 'YES'
  description: This is the name of the patient. Column Name
- name: FileNo
  type: int
  IS_NULLABLE: 'YES'
  description: This is the file number of the patient. Column FileNo
- name: RegisteredOn
  type: date
  IS_NULLABLE: 'YES'
  description: When the patient was registered in the system. Column RegisteredOn
- name: DateOfBirth
  type: date
  IS_NULLABLE: 'YES'
  description: When the patient was born. Column DateOfBirth
- name: Gender
  type: varchar
  IS_NULLABLE: 'YES'
  description: This is the gender of the patient. Column Gender
- name: Nationality
  type: varchar
  IS_NULLABLE: 'YES'
  description: This gives the nationality of the patient. For queries, this column helps in filtering patients based on their nationality. Column Nationality
- name: ResidencyType
  type: varchar
  IS_NULLABLE: 'YES'
  description: This is the type of residency for the patient. Column ResidencyType
- name: TPS_Id
  type: int
  IS_NULLABLE: 'YES'
  description: This is the internal identifier for the patient. Column TPS_Id
- name: BranchId
  type: int
  IS_NULLABLE: 'YES'
  description: Branch where this record belongs (BranchMaster.BranchId)  

branch_column: BranchId           # filtered to the selected branch(es) automatically    

branch_linked: "Id IN (SELECT PatientId FROM dbo.Appointment WHERE BranchId IN ({branch_ids}))"

business_notes: for a user query, never return any ID or TPS_Id column in the output. It is an internal identifier and should not be exposed to end users.
