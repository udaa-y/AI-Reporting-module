tables:
  - name: Employee
    description: "Stores employee details including name, department, employee type, gender, and TPS identifier."

  - name: Patient
    description: "Stores patient demographics and registration information, including MRN, date of birth, gender, nationality, residency type, and TPS identifier."

  - name: Appointment
    description: "Stores patient appointment details, including visit date, patient, doctor, visit status, patient type, parent appointment reference, e-prescription reference number, and TPS identifier."

  - name: Complaints
    description: "Stores patient complaints recorded for each appointment, along with the associated appointment reference and TPS identifier."

  - name : ServicePrescription
    description: "Stores services prescribed or performed during appointments, including service code, name, type, quantity, cost, facility, appointment reference, and TPS identifier."

  - name: MedicinePrescription
    description: "Stores medicines prescribed during appointments, including medicine code, name, type, quantity, use type, facility, status, manufacturer, appointment reference, and TPS identifier."